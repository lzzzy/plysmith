name: Fehler melden
description: Einen reproduzierbaren Fehler in Plysmith beschreiben
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Vielen Dank! Ein Bericht ist auch ohne Diagnosebericht hilfreich. Bitte keine Datenbank, aktive Konfiguration, .env, privaten Partien, Notizen oder unbearbeiteten Logs hochladen. Screenshots und Diagnoseberichte vor dem Anhängen prüfen.
  - type: input
    id: version
    attributes:
      label: Plysmith-Version
      description: In Einstellungen > Lokales System > Technische Details. Wenn Plysmith nicht startet, genügt der Name der heruntergeladenen Installerdatei.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows-Version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Wiederholung
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots oder redigierter Diagnosebericht (optional)
      description: Freiwillig. Vor dem Anhängen selbst auf private Inhalte prüfen und bei Bedarf unkenntlich machen.
